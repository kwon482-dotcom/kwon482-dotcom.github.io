<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kwon Mobile Apps</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #fff;
    }
    header p {
      color: var(--subtext);
      font-size: 1.05rem;
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .icon {
      font-size: 2.2rem;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 12px;
      flex-shrink: 0;
    }
    .card-body h3 {
      font-size: 1.15rem;
      margin-bottom: 4px;
    }
    .card-body p {
      color: var(--subtext);
      font-size: 0.92rem;
    }
    footer {
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      color: var(--subtext);
      font-size: 0.9rem;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Kwon Apps</h1>
      <p>일상을 더 편리하고 단단하게 만드는 모바일 라이프 앱 스튜디오</p>
    </header>

    <div class="card-grid">
      <div class="card">
        <div class="icon">💰</div>
        <div class="card-body">
          <h3>On가계부</h3>
          <p>혼자 쓰고 같이 쓰는 실시간 공유 가계부 & 지출 관리</p>
        </div>
      </div>

      <div class="card">
        <div class="icon">⏱️</div>
        <div class="card-body">
          <h3>On타이머</h3>
          <p>운동 인터벌 & 집중을 위한 미니멀 맞춤형 타이머</p>
        </div>
      </div>

      <div class="card">
        <div class="icon">📚</div>
        <div class="card-body">
          <h3>작심삼일본어</h3>
          <p>JLPT 필수 단어·한자·문법 암기 스마트 플래시카드</p>
        </div>
      </div>

      <div class="card">
        <div class="icon">🔄</div>
        <div class="card-body">
          <h3>했니?</h3>
          <p>작심삼일 타파! 매일의 루틴과 습관을 점검하는 스마트 트래커</p>
        </div>
      </div>
    </div>

    <footer>
      <p>문의 및 지원: <a href="mailto:onwallet@gmail.com">onwallet@gmail.com</a></p>
      <p style="margin-top: 8px;">&copy; 2026 Kwon Apps. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
